---
# wieseschwarm-2 installs to its Crucial SATA SSD: firmware cannot boot Talos from its
# Samsung NVMe (hangs at the Talos splash). The NVMe backs pool1 via storage-nodes.
machine:
  install:
    diskSelector:
      model: CT500MX500SSD1*
      type: ssd
  nodeLabels:
    node-role.kubernetes.io/storage: "true"
