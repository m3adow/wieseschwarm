---
machine:
  # Use a disk and disk selector that's never correct to prevent accidental installation on the wrong disk. The actual disk selector is defined in the patches for each node.
  install:
    disk: /dev/doesnotexist
    diskSelector:
      model: I DO NOT EXIST
      type: doesnotexist
  features:
    rbac: true
  # Talos defaults user.max_user_namespaces to 0, which silently makes UserNamespacesSupport
  # (below) non-functional: any pod setting hostUsers: false fails pod sandbox creation with
  # "failed to start noop process for unshare: fork/exec /proc/self/exe: no space left on
  # device" -- a Linux kernel ENOSPC quirk for hitting a max_*_namespaces ceiling, unrelated to
  # actual disk space. 11255 is the value Talos's own docs recommend.
  # https://docs.siderolabs.com/kubernetes-guides/security/usernamespace
  sysctls:
    user.max_user_namespaces: "11255"
  kubelet:
    extraArgs:
      feature-gates: InPlacePodVerticalScaling=true,RecursiveReadOnlyMounts=true,UserNamespacesSupport=true
    # nodeIP.validSubnets: configured in talos/secret/wieseschwarm-all-patch.yaml
    # nodeIP:
    #   validSubnets:
    #     - <cluster-subnet/CIDR>
  # network:
  #   searchDomains:
  #     - <search-domain>
cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: flannel
      flannel:
        kubeNetworkPoliciesEnabled: true
  apiServer:
    extraArgs:
      feature-gates: InPlacePodVerticalScaling=true
  scheduler:
    extraArgs:
      feature-gates: InPlacePodVerticalScaling=true
  # etcd:
  #   advertisedSubnets: # listenSubnets defaults to advertisedSubnets if not set explicitly
  #     - <cluster-subnet/CIDR>
