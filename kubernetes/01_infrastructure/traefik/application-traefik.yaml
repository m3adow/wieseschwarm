---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "42.x"
    helm:
      releaseName: traefik
      values: |
        ingressClass:
          enabled: true
          isDefaultClass: true
        providers:
          kubernetesCRD:
            enabled: true
            # LAN-only routes in other namespaces reference traefik/lan-clients-only.
            allowCrossNamespace: true
          kubernetesIngress:
            enabled: true
        service:
          annotations:
            metallb.universe.tf/loadBalancerIPs: "192.168.10.40"
          spec:
            type: LoadBalancer
            # Keeps LAN client IPs (no SNAT); lan-clients-only relies on it.
            externalTrafficPolicy: Local
        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.wieseschwarm.lan`)
            entryPoints:
              - websecure
            middlewares:
              - name: lan-clients-only
              - name: traefik-dashboard-basicauth
            tls: {}
        deployment:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
