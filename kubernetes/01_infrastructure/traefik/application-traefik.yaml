---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "42.x"
    helm:
      releaseName: traefik
      values: |
        ingressClass:
          enabled: true
          isDefaultClass: true
        providers:
          kubernetesCRD:
            enabled: true
            # LAN-only routes in other namespaces reference traefik/lan-clients-only.
            allowCrossNamespace: true
          kubernetesIngress:
            enabled: true
        service:
          annotations:
            metallb.universe.tf/loadBalancerIPs: "192.168.10.40"
          spec:
            type: LoadBalancer
            # Keeps LAN client IPs (no SNAT); lan-clients-only relies on it.
            externalTrafficPolicy: Local
          additionalServices:
            internal:
              spec:
                type: ClusterIP
        ports:
          web:
            asDefault: true
          websecure:
            asDefault: true
            http:
              middlewares:
                - traefik-strip-cf-connecting-ip@kubernetescrd
          tunnel:
            port: 8444
            exposedPort: 8444
            protocol: TCP
            expose:
              default: false
              internal: true
            http:
              tls:
                enabled: true
              middlewares:
                - traefik-strip-client-forwarding@kubernetescrd
              aliasHeadersStrategy: delete
            # Only cloudflared reaches this port (NetworkPolicy), so its XFF is trusted.
            forwardedHeaders:
              trustedIPs:
                - 10.244.0.0/16
        extraObjects:
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: strip-client-forwarding
              namespace: traefik
            spec:
              headers:
                customRequestHeaders:
                  # A trusted entrypoint keeps client-sent values; "" deletes them.
                  X-Forwarded-Host: ""
                  X-Forwarded-Method: ""
                  X-Forwarded-Port: "443"
                  X-Forwarded-Prefix: ""
                  X-Forwarded-Tls-Client-Cert: ""
                  X-Forwarded-Tls-Client-Cert-Info: ""
                  X-Forwarded-Uri: ""
                  X-Real-Ip: ""
          - apiVersion: traefik.io/v1alpha1
            kind: Middleware
            metadata:
              name: strip-cf-connecting-ip
              namespace: traefik
            spec:
              headers:
                customRequestHeaders:
                  # Only Cloudflare (via tunnel) may set it; on websecure anyone could.
                  CF-Connecting-IP: ""
        ingressRoute:
          dashboard:
            enabled: true
            matchRule: Host(`traefik.wieseschwarm.lan`)
            entryPoints:
              - websecure
            middlewares:
              - name: lan-clients-only
              - name: traefik-dashboard-basicauth
            tls: {}
        deployment:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
