---
apiVersion: v1
kind: Service
metadata:
  name: kube-network-policies-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-network-policies
  annotations:
    ignore-check.kube-linter.io/dangling-service: >-
      Selects the Talos-managed kube-flannel DaemonSet, which is not in git
spec:
  # The Talos-rendered container declares no ports, so a PodMonitor cannot find it.
  clusterIP: None
  selector:
    k8s-app: flannel
  ports:
    - name: metrics
      port: 9080
      targetPort: 9080
      protocol: TCP
