---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-cluster
  namespace: mariadb
spec:
  # Pinned so Renovate tracks it; the operator's default applies only at creation.
  image: mariadb:11.8.10

  rootPasswordSecretKeyRef:
    name: mariadb-credentials
    key: rootPassword

  storage:
    storageClassName: piraeus-replicated
    size: 5Gi

  replicas: 3

  affinity:
    antiAffinityEnabled: true

  updateStrategy:
    # init/agent follow the floating 26.x chart; each operator release rolls the pods.
    autoUpdateDataPlane: true

  galera:
    enabled: true
    recovery:
      enabled: true

  maxScaleRef:
    name: mariadb-cluster-maxscale
