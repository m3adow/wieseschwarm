---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MaxScale
metadata:
  name: mariadb-cluster-maxscale
  namespace: mariadb
spec:
  image: mariadb/maxscale:23.08.13

  mariaDbRef:
    name: mariadb-cluster

  replicas: 2

  # Not antiAffinityEnabled: that also keeps MaxScale off MariaDB nodes (5 nodes needed).
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - mariadb-cluster-maxscale
          topologyKey: kubernetes.io/hostname

  services:
    - name: rw-router
      router: readwritesplit
      listener:
        port: 3306
        protocol: MariaDBProtocol

  monitor:
    module: galeramon
    interval: 2s
    cooperativeMonitoring: majority_of_all
    params:
      disable_master_failback: "false"
      available_when_donor: "false"
      disable_master_role_setting: "false"

  auth:
    generate: true

  kubernetesService:
    type: ClusterIP
