---
apiVersion: v1
kind: Service
metadata:
  name: etcd-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: etcd-metrics
  annotations:
    ignore-check.kube-linter.io/dangling-service: >-
      No selector on purpose: etcd is a Talos host service, so the EndpointSlice next to this
      file lists the node addresses by hand
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: 2381
      targetPort: 2381
      protocol: TCP
