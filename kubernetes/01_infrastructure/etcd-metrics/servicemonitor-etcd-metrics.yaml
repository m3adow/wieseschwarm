---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: etcd-metrics
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd-metrics
  endpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpointslice_endpoint_node_name]
          targetLabel: node
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: etcd_disk_(wal_fsync|backend_commit)_duration_seconds_(bucket|sum|count)|etcd_server_(leader_changes_seen_total|has_leader|is_leader|proposals_failed_total)
          action: keep
