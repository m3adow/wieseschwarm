---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: "4.x"
    helm:
      releaseName: grafana-alloy
      values: |
        cluster:
          name: wieseschwarm

        destinations:
          grafana-cloud-metrics:
            type: prometheus
            url: "https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push"
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: monitoring
            auth:
              type: basic
              usernameKey: username-prometheus
              passwordKey: password
            # Cluster-wide default: drops these regardless of source (clusterMetrics,
            # hostMetrics, ServiceMonitor-scraped apps, anything future). Complements,
            # not replaces, the per-source metricsTuning below — this is the safety
            # net every metric passes through before leaving the cluster; per-source
            # metricsTuning is still where to fine-tune what Alloy scrapes at all.
            metricProcessingRules: |
              write_relabel_config {
                source_labels = ["__name__"]
                regex          = "go_.*|rest_client_.*"
                action         = "drop"
              }

          grafana-cloud-logs:
            type: loki
            url: "https://logs-prod-012.grafana.net/loki/api/v1/push"
            secret:
              create: false
              name: grafana-cloud-credentials
              namespace: monitoring
            auth:
              type: basic
              usernameKey: username-loki
              passwordKey: password

        # metricsTuning is scoped per SOURCE on this feature — there is no top-level
        # clusterMetrics.metricsTuning key in the chart's schema, so we go per-source.
        # Each source ships only what PromQL rules read; see this dir's CLAUDE.md.
        # Never empty an includeMetrics: with no keep-list the chart ships every metric.
        clusterMetrics:
          enabled: true
          collector: alloy-metrics
          kubeletResource:
            enabled: false
          kube-state-metrics:
            metricsTuning:
              useDefaultAllowList: false
              includeMetrics:
                - "kube_cronjob_created"
                - "kube_cronjob_info"
                - "kube_cronjob_status_last_successful_time"
                - "kube_daemonset_status_current_number_scheduled"
                - "kube_daemonset_status_desired_number_scheduled"
                - "kube_daemonset_status_number_available"
                - "kube_daemonset_status_number_misscheduled"
                - "kube_daemonset_status_updated_number_scheduled"
                - "kube_deployment_spec_replicas"
                - "kube_deployment_status_replicas_available"
                - "kube_deployment_status_replicas_updated"
                - "kube_job_failed"
                - "kube_job_owner"
                - "kube_job_status_active"
                - "kube_job_status_completion_time"
                - "kube_job_status_start_time"
                - "kube_node_status_condition"
                - "kube_pod_container_status_last_terminated_reason"
                - "kube_pod_container_status_restarts_total"
                - "kube_pod_owner"
                - "kube_pod_status_phase"
                - "kube_statefulset_replicas"
                - "kube_statefulset_status_replicas_ready"
                - "kube_statefulset_status_replicas_updated"
          kubelet:
            metricsTuning:
              useDefaultAllowList: false
              includeMetrics:
                - "kubelet_volume_stats_capacity_bytes"
                - "kubelet_volume_stats_used_bytes"
          cadvisor:
            metricsTuning:
              useDefaultAllowList: false
              includeMetrics:
                - "container_cpu_usage_seconds_total"
                - "container_network_transmit_bytes_total"

        # node-exporter is a SEPARATE feature from clusterMetrics — clusterMetrics has
        # no node-exporter source at all (it only covers kubelet/cadvisor/apiServer/
        # kube-state-metrics-style in-cluster sources). hostMetrics.linuxHosts is what
        # actually scrapes the node-exporter DaemonSet telemetryServices already deploys.
        hostMetrics:
          enabled: true
          collector: alloy-metrics
          linuxHosts:
            enabled: true
            metricsTuning:
              useDefaultAllowList: false
              includeMetrics:
                - "node_filefd_allocated"
                - "node_filefd_maximum"
                - "node_filesystem_avail_bytes"
                - "node_filesystem_readonly"
                - "node_filesystem_size_bytes"
                - "node_memory_MemAvailable_bytes"
                - "node_memory_MemTotal_bytes"
                - "node_timex_maxerror_seconds"
                - "node_timex_sync_status"

        # Discovers ServiceMonitor/PodMonitor CRDs cluster-wide (no namespace/label
        # filter — every app in this homelab is trusted to declare its own monitor).
        # Uses the CRDs from prometheus-operator-crds (wave -4); no separate
        # Prometheus Operator controller process is needed, Alloy watches directly.
        prometheusOperatorObjects:
          enabled: true
          collector: alloy-metrics

        clusterEvents:
          enabled: true
          collector: alloy-singleton

        # Streams pod logs from the Kubernetes API server — no DaemonSet needed.
        podLogsViaKubernetesApi:
          enabled: true
          collector: alloy-singleton
          # knp logs every packet (Talos fixes --v=2); keep only denials, errors, panics.
          # Rendered via tpl: must not contain "{{".
          extraLogProcessingStages: |
            stage.match {
              selector = "{namespace=\"kube-system\", container=\"kube-network-policies\"} !~ \"(?i)denied|^[EWF][0-9]{4} |panic\""
              action   = "drop"
            }

        applicationObservability:
          enabled: false
        profiling:
          enabled: false
        costMetrics:
          enabled: false
        selfReporting:
          enabled: false

        telemetryServices:
          kube-state-metrics:
            deploy: true
          node-exporter:
            deploy: true

        collectors:
          alloy-metrics:
            presets: [clustered, statefulset]
          alloy-singleton:
            presets: [singleton]
            extraConfig: |
              remote.kubernetes.secret "mimir_rules_auth" {
                name      = "grafana-cloud-credentials"
                namespace = "monitoring"
              }

              mimir.rules.kubernetes "sync" {
                address                = "https://prometheus-prod-65-prod-eu-west-2.grafana.net"
                prometheus_http_prefix = "/api/prom"
                basic_auth {
                  username = convert.nonsensitive(remote.kubernetes.secret.mimir_rules_auth.data["username-prometheus"])
                  password = remote.kubernetes.secret.mimir_rules_auth.data["password"]
                }
                // LogQL rules go to the Loki ruler below; Mimir cannot parse them.
                rule_selector {
                  match_expression {
                    key      = "ruler"
                    operator = "NotIn"
                    values   = ["loki"]
                  }
                }
              }

              loki.rules.kubernetes "sync" {
                address = "https://logs-prod-012.grafana.net"
                basic_auth {
                  username = convert.nonsensitive(remote.kubernetes.secret.mimir_rules_auth.data["username-loki"])
                  password = remote.kubernetes.secret.mimir_rules_auth.data["password"]
                }
                rule_selector {
                  match_labels = {
                    ruler = "loki",
                  }
                }
              }

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # node-exporter requires hostNetwork, hostPID, and hostPath mounts (/, /proc, /sys) — blocked by baseline
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    syncOptions:
      - CreateNamespace=true
