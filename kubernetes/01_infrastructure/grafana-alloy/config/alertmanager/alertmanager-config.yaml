---
route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: telegram
      continue: true
      repeat_interval: 2h
    - matchers:
        - severity="critical"
      receiver: email
      repeat_interval: 6h
receivers:
  - name: telegram
    telegram_configs:
      - bot_token: ${TELEGRAM_BOT_TOKEN}
        chat_id: ${TELEGRAM_CHAT_ID}
        message: '{{ template "telegram.wieseschwarm.message" . }}'
        # Plain text: HTML escapes count toward the 4096-rune limit
        parse_mode: ""
        send_resolved: true
  - name: email
    email_configs:
      - to: ${SMTP_TO}
        from: ${SMTP_FROM}
        smarthost: ${SMTP_SMARTHOST}
        auth_username: ${SMTP_USERNAME}
        auth_password: ${SMTP_PASSWORD}
        require_tls: false
        force_implicit_tls: true
        send_resolved: true
