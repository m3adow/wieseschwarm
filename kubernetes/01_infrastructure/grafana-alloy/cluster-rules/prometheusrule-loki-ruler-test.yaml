---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki-ruler-test
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: grafana-alloy
    ruler: loki
spec:
  groups:
    - name: loki-ruler-test
      rules:
        # Temporary, always firing while backup logs exist: proves the Loki ruler path
        # reaches the Cloud Alertmanager. Remove once the notification has arrived.
        - alert: LokiRulerDeliveryTest
          expr: |
            sum(count_over_time({container="backup", job=~".+/backup"}[26h])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Loki ruler delivery test (temporary, safe to ignore)"
            description: "Fires while backup pod logs exist. Remove prometheusrule-loki-ruler-test.yaml once this notification arrived."
