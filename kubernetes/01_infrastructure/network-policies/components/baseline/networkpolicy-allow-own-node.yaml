---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-own-node
spec:
  # NetworkPolicy semantics allow ingress from a pod's own node. The engine only exempts uid-0
  # sockets, so kernel RSTs that close kubelet probes would be dropped. Other nodes reach pods
  # as their flannel.1 address (10.244.X.0), which is not listed, so this matches the own node.
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.10.11/32
        - ipBlock:
            cidr: 192.168.10.12/32
        - ipBlock:
            cidr: 192.168.10.13/32
        - ipBlock:
            cidr: 10.244.0.1/32
        - ipBlock:
            cidr: 10.244.1.1/32
        - ipBlock:
            cidr: 10.244.2.1/32
