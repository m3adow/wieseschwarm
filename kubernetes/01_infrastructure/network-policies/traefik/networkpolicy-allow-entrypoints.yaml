---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-entrypoints
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - traefik
  policyTypes:
    - Ingress
  # No `from`: LAN clients arrive via LB eTP=Cluster (partly masqueraded), plus cloudflared.
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
