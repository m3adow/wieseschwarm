---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - metrics-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.10.11/32
        - ipBlock:
            cidr: 192.168.10.12/32
        - ipBlock:
            cidr: 192.168.10.13/32
        - ipBlock:
            cidr: 10.244.0.0/31
        - ipBlock:
            cidr: 10.244.1.0/31
        - ipBlock:
            cidr: 10.244.2.0/31
      ports:
        - protocol: TCP
          port: 10250
