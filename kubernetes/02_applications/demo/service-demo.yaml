---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: demo
spec:
  # Explicit so kube-linter's dangling-service check passes on this file standalone.
  selector:
    app.kubernetes.io/name: demo
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: metrics
