---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

labels:
  - pairs:
      app.kubernetes.io/name: demo
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/instance: demo
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
    includeTemplates: true

components:
  - ../../01_infrastructure/network-policies/components/baseline
  - ../../01_infrastructure/network-policies/components/egress-baseline

resources:
  - certificate-demo-public.yaml
  - configmap-demo-nginx.yaml
  - database-demo.yaml
  - deployment-demo.yaml
  - grant-demo.yaml
  - ingressroute-demo-lan.yaml
  - ingressroute-demo-public.yaml
  - namespace.yaml
  - networkpolicy-allow-alloy-metrics.yaml
  - networkpolicy-allow-egress-mariadb.yaml
  - networkpolicy-allow-traefik.yaml
  - persistentvolumeclaim-demo.yaml
  - prometheusrule-demo.yaml
  - schedule-demo-k8up.yaml
  - service-demo.yaml
  - servicemonitor-demo.yaml
  - sopssecret-demo-k8up-b2.yaml
  - sopssecret-demo-mariadb-user.yaml
  - user-demo.yaml
  - verticalpodautoscaler-demo.yaml
