---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo
  namespace: demo
spec:
  # Required: kustomize's includeSelectors only rewrites built-in GVK selector
  # paths, never CRD ones, so the transformer never synthesizes this.
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  endpoints:
    - port: metrics
      path: /metrics
