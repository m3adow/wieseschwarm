---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-html
  namespace: demo
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/instance: demo
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: piraeus-replicated
  resources:
    requests:
      storage: 64Mi
