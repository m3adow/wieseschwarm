---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-of-apps
  namespace: argocd
  annotations:
    # Pruning the root would cascade via resources-finalizer to every child app.
    argocd.argoproj.io/sync-options: Prune=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:m3adow/wieseschwarm.git
    targetRevision: feature/k8up-loki-backup-alert
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Argo CD adds these to child Applications whose charts ship delete hooks; git
  # cannot declare them. See "Hook finalizers on child Applications" in kubernetes/CLAUDE.md.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - '.metadata.finalizers[] | select(startswith("pre-delete-finalizer.argocd.argoproj.io") or startswith("post-delete-finalizer.argocd.argoproj.io"))'
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
